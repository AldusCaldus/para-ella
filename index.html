<!doctype html>
<html lang="es">
<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#3b285b}button{font:inherit}.scene{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(255,215,235,.28),transparent 27%),linear-gradient(180deg,#35245e 0%,#6b3f7f 43%,#c96f9f 74%,#f4a9c2 100%)}.moon{position:absolute;width:84px;height:84px;top:8%;right:9%;border-radius:50%;background:#fff4e7;box-shadow:0 0 25px #ffffff66,0 0 60px #ffd8ec55;z-index:1}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:.7;animation:twinkle 2.5s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.7)}}.message{position:absolute;top:12%;left:50%;width:85%;max-width:520px;transform:translateX(-50%) translateY(10px);text-align:center;color:#fff7fb;opacity:0;transition:1.6s;z-index:6}.scene.started .message{opacity:1;transform:translateX(-50%);transition-delay:2.4s}.message h1{font:400 clamp(28px,7.5vw,44px) Georgia,serif;margin:0 0 8px}.message p{margin:0;line-height:1.5;font-size:clamp(14px,4vw,18px);opacity:.84}.couple{position:absolute;left:50%;bottom:12%;width:min(88vw,410px);transform:translateX(-50%);z-index:5}.couple svg{width:100%;display:block;overflow:visible}.boy,.girl,.boyd,.girld{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}.boy{stroke:#79c8ff;stroke-width:3.8}.girl{stroke:#ff8fc7;stroke-width:3.8}.boyd{stroke:#c7ecff;stroke-width:2.4}.girld{stroke:#ffd0e6;stroke-width:2.4}.scene.started .boy{animation:draw 3s ease forwards}.scene.started .girl{animation:draw 3s ease .25s forwards}.scene.started .boyd,.scene.started .girld{animation:draw 2.2s ease .9s forwards}@keyframes draw{to{stroke-dashoffset:0}}.scene.started .couple{animation:breathe 4s ease-in-out 3.3s infinite}@keyframes breathe{50%{transform:translateX(-50%) translateY(-4px)}}.ground{position:absolute;left:-12%;right:-12%;bottom:-10%;height:30%;border-radius:50% 50% 0 0/20% 20% 0 0;background:linear-gradient(#4f335438,#2a203ea6);border-top:1.5px solid #ffd2e761;z-index:2}.lilies{position:absolute;left:0;right:0;bottom:7%;height:34%;z-index:6;pointer-events:none;opacity:0;transform:translateY(30px) scale(.96);transition:1.8s cubic-bezier(.2,.8,.2,1) 2.4s}.scene.started .lilies{opacity:1;transform:translateY(0) scale(1)}.lily{position:absolute;bottom:0;width:92px;height:178px;filter:drop-shadow(0 4px 8px rgba(49,22,63,.22));transform-origin:50% 100%;animation:sway 4.8s ease-in-out infinite alternate}.lily:nth-child(2n){animation-duration:5.7s}.lily:nth-child(3n){animation-duration:6.3s}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}.lily .stem{fill:none;stroke:#c8e8d6;stroke-width:2.4;stroke-linecap:round}.lily .leaf{fill:none;stroke:#b4dcc8;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.lily .petal-l{fill:#fff8ff;stroke:#f0c9ea;stroke-width:1.4}.lily.pink .petal-l{fill:#ffd7e8;stroke:#f5aecd}.lily.lilac .petal-l{fill:#eadcff;stroke:#c8aef1}.lily .center{fill:#ffd68a}.lily.small{width:72px;height:142px;opacity:.95}.lily.tiny{width:62px;height:120px;opacity:.9}.lily.left1{left:1%}.lily.left2{left:14%}.lily.left3{left:27%}.lily.right1{right:1%}.lily.right2{right:14%}.lily.right3{right:27%}@media(max-width:430px){.couple{bottom:13%;width:min(84vw,390px)}.lilies{bottom:8%;height:36%}.lily{width:82px;height:166px}.lily.small{width:68px;height:138px}.lily.tiny{width:58px;height:116px}.lily.left1{left:-2%}.lily.left2{left:12%}.lily.left3{left:24%}.lily.right1{right:-2%}.lily.right2{right:12%}.lily.right3{right:24%}}.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:8}.petal{position:absolute;top:-25px;width:8px;height:8px;background:#ffa3c7;box-shadow:8px 0 #ffd0e2,0 8px #e978a8,8px 8px #ffbbd5;image-rendering:pixelated;opacity:0}.scene.started .petal{animation:fall linear forwards}@keyframes fall{0%{opacity:0;transform:translate3d(0,-30px,0) rotate(0)}10%{opacity:.95}45%{transform:translate3d(35px,45dvh,0) rotate(180deg)}100%{opacity:.2;transform:translate3d(-30px,105dvh,0) rotate(360deg)}}.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at center,#eb84b738,transparent 45%),linear-gradient(#322258,#6f3d7c);transition:.85s;z-index:100}.start.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{text-align:center;color:#fff;max-width:360px}.heart{font-size:58px;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.13)}}.card h2{font:400 34px Georgia,serif;margin:10px 0 8px}.card p{margin:0;line-height:1.5;color:#ffffffbf}.btn{margin-top:24px;min-height:54px;padding:0 27px;border:1px solid #ffffffa6;border-radius:999px;background:#ffffff1f;color:white;font-weight:600;font-size:17px;touch-action:manipulation}.music-wrap{margin-top:18px}.music-label{margin:0 0 9px;color:#fff;font-size:15px;font-weight:600;letter-spacing:.2px}.music-frame{display:block;width:100%;height:135px;border:0;border-radius:16px;box-shadow:0 12px 35px #1b0d2f59}.music-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;min-height:48px;padding:0 22px;border:1px solid #ffffff8a;border-radius:999px;color:#fff;background:#ffffff18;font-size:15px;font-weight:700;touch-action:manipulation}.music-btn:disabled{opacity:.55}.hint{margin-top:9px!important;font-size:11.5px!important;opacity:.72!important}
</style>
</head>

<section class="start" id="start"><div class="card"><div class="heart">♡</div><h2>Para ti</h2><p>Preparé algo bonito para recordarte lo bonito que es estar contigo.</p><div class="music-wrap"><div class="music-label">Presiona aquí ♫</div><div id="yt-player" class="music-frame" aria-label="Reproductor de Amor de Emmanuel Cortes"></div><button class="music-btn" id="musicBtn" type="button" disabled>Preparando canción…</button><p class="hint" id="musicHint">La canción se reproduce aquí mismo, sin salir de la página.</p></div><button class="btn" id="btn" type="button">Toca para comenzar 🌸</button></div></section>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let ytPlayer=null;
window.onYouTubeIframeAPIReady=()=>{
  ytPlayer=new YT.Player('yt-player',{
    width:'100%',height:'135',videoId:'TX-1dI8t6WM',
    playerVars:{playsinline:1,controls:1,rel:0,modestbranding:1},
    events:{onReady:()=>{
      const musicBtn=document.getElementById('musicBtn');
      musicBtn.disabled=false;
      musicBtn.textContent='Presiona aquí ♫';
      musicBtn.addEventListener('click',()=>{
        const st=ytPlayer.getPlayerState();
        if(st===YT.PlayerState.PLAYING){ytPlayer.pauseVideo();musicBtn.textContent='Continuar canción ♫';}
        else{ytPlayer.playVideo();musicBtn.textContent='Pausar canción ♫';}
      });
    }}
  });
};
(()=>{const scene=document.getElementById('scene'),btn=document.getElementById('btn'),start=document.getElementById('start'),petals=document.getElementById('petals'),stars=document.getElementById('stars');let started=false,timer=null;for(let i=0;i<42;i++){const s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*58+'%';s.style.animationDelay=Math.random()*3+'s';stars.appendChild(s)}function petal(){const p=document.createElement('span');p.className='petal';p.style.left=Math.random()*100+'%';p.style.animationDuration=5+Math.random()*5+'s';p.style.transform='scale('+(.5+Math.random())+')';petals.appendChild(p);setTimeout(()=>p.remove(),10500)}function go(){if(started)return;started=true;scene.classList.add('started');start.classList.add('hidden');for(let i=0;i<18;i++)setTimeout(petal,i*100);timer=setInterval(petal,380)}btn.addEventListener('click',go);window.addEventListener('pagehide',()=>{if(timer)clearInterval(timer)})})();
</script>
