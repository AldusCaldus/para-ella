<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d3477">
<title>Para ti 🌸</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#3b285b}button{font:inherit}.scene{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 28%,rgba(255,215,235,.28),transparent 27%),linear-gradient(180deg,#35245e 0%,#6b3f7f 43%,#c96f9f 74%,#f4a9c2 100%)}.moon{position:absolute;width:84px;height:84px;top:8%;right:9%;border-radius:50%;background:#fff4e7;box-shadow:0 0 25px #ffffff66,0 0 60px #ffd8ec55;z-index:1}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:.7;animation:twinkle 2.5s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.7)}}.message{position:absolute;top:12%;left:50%;width:85%;max-width:520px;transform:translateX(-50%) translateY(10px);text-align:center;color:#fff7fb;opacity:0;transition:1.6s;z-index:6}.scene.started .message{opacity:1;transform:translateX(-50%);transition-delay:2.4s}.message h1{font:400 clamp(28px,7.5vw,44px) Georgia,serif;margin:0 0 8px}.message p{margin:0;line-height:1.5;font-size:clamp(14px,4vw,18px);opacity:.84}.couple{position:absolute;left:50%;bottom:12%;width:min(88vw,410px);transform:translateX(-50%);z-index:5}.couple svg{width:100%;display:block;overflow:visible}.boy,.girl,.boyd,.girld{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000}.boy{stroke:#79c8ff;stroke-width:3.8}.girl{stroke:#ff8fc7;stroke-width:3.8}.boyd{stroke:#c7ecff;stroke-width:2.4}.girld{stroke:#ffd0e6;stroke-width:2.4}.scene.started .boy{animation:draw 3s ease forwards}.scene.started .girl{animation:draw 3s ease .25s forwards}.scene.started .boyd,.scene.started .girld{animation:draw 2.2s ease .9s forwards}@keyframes draw{to{stroke-dashoffset:0}}.scene.started .couple{animation:breathe 4s ease-in-out 3.3s infinite}@keyframes breathe{50%{transform:translateX(-50%) translateY(-4px)}}.ground{position:absolute;left:-12%;right:-12%;bottom:-10%;height:30%;border-radius:50% 50% 0 0/20% 20% 0 0;background:linear-gradient(#4f335438,#2a203ea6);border-top:1.5px solid #ffd2e761;z-index:2}.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:8}.petal{position:absolute;top:-25px;width:8px;height:8px;background:#ffa3c7;box-shadow:8px 0 #ffd0e2,0 8px #e978a8,8px 8px #ffbbd5;image-rendering:pixelated;opacity:0}.scene.started .petal{animation:fall linear forwards}@keyframes fall{0%{opacity:0;transform:translate3d(0,-30px,0) rotate(0)}10%{opacity:.95}45%{transform:translate3d(35px,45dvh,0) rotate(180deg)}100%{opacity:.2;transform:translate3d(-30px,105dvh,0) rotate(360deg)}}.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at center,#eb84b738,transparent 45%),linear-gradient(#322258,#6f3d7c);transition:.85s;z-index:100}.start.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{text-align:center;color:#fff;max-width:360px}.heart{font-size:58px;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.13)}}.card h2{font:400 34px Georgia,serif;margin:10px 0 8px}.card p{margin:0;line-height:1.5;color:#ffffffbf}.btn{margin-top:24px;min-height:54px;padding:0 27px;border:1px solid #ffffffa6;border-radius:999px;background:#ffffff1f;color:white;font-weight:600;font-size:17px;touch-action:manipulation}.spotify-wrap{margin-top:20px}.spotify-label{margin:0 0 9px;color:#fff;font-size:15px;font-weight:600;letter-spacing:.2px}.spotify-frame{display:block;width:100%;height:152px;border:0;border-radius:16px;box-shadow:0 12px 35px #1b0d2f59}.hint{margin-top:10px!important;font-size:12px!important;opacity:.68!important}
</style>
</head>
<body>
<main class="scene" id="scene">
<div class="moon"></div><div class="stars" id="stars"></div>
<section class="message"><h1>Contigo, todo florece.</h1><p>Y de todos los caminos, mi favorito siempre será el que recorra a tu lado.</p></section>
<div class="couple"><svg viewBox="0 0 400 410" aria-label="Una pareja tomada de la mano">
<path class="boy" d="M75 105 C61 72 79 42 112 37 C145 32 166 54 163 85"/><path class="boy" d="M78 82 C78 52 101 39 126 44 C151 48 166 70 158 96 C151 119 128 130 106 123 C89 118 79 101 78 82"/><path class="boyd" d="M98 82 C102 79 106 79 110 82 M128 82 C132 79 136 79 140 82 M104 97 C113 104 122 104 131 97"/><path class="boy" d="M102 126 C95 145 90 170 91 203 L94 260 M137 126 C147 150 151 175 149 207 L145 260 M95 144 C79 161 70 185 67 211 M146 149 C158 169 173 186 190 198 M95 260 C94 300 90 337 87 376 M144 260 C146 301 152 339 156 376"/>
<path class="girl" d="M248 94 C235 61 251 34 284 30 C319 26 343 53 340 88 C338 116 329 137 324 149 M249 88 C243 110 243 133 252 150"/><path class="girl" d="M254 79 C255 51 277 38 301 42 C326 47 340 67 334 92 C329 115 309 128 287 124 C268 121 255 103 254 79"/><path class="girld" d="M274 81 C278 77 282 77 286 81 M304 81 C308 77 312 77 316 81 M279 98 C289 106 300 106 310 98"/><path class="girl" d="M272 128 C263 148 258 176 259 207 L262 260 M311 128 C321 151 325 177 322 207 L318 260 M266 149 C251 167 232 185 210 199 M318 145 C333 165 340 188 342 214 M262 260 C261 301 257 340 253 376 M318 260 C319 302 324 340 328 376"/>
<path class="boy" d="M190 198 C196 204 203 205 210 199"/><path class="girl" d="M210 199 C205 207 198 207 190 198"/>
<path class="girl" d="M318 54 C314 44 303 43 300 51 C295 42 284 45 285 55 C276 53 272 63 280 68 C273 76 281 83 289 77 C294 87 305 82 303 73 C315 77 321 68 313 61 C322 59 325 51 318 54 Z"/><circle cx="299" cy="62" r="3.8" fill="#ffc4df"/>
</svg></div>
<div class="ground"></div><div class="petals" id="petals"></div>
<section class="start" id="start"><div class="card"><div class="heart">♡</div><h2>Para ti</h2><p>Preparé algo pequeño para recordarte lo bonito que es caminar contigo.</p><div class="spotify-wrap"><div class="spotify-label">Presiona aquí ♫</div><iframe class="spotify-frame" src="https://open.spotify.com/embed/track/0hkoQgoqic1qQtxPOudmrx?utm_source=generator&theme=0" title="Amor — Emmanuel Cortes en Spotify" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe><p class="hint">Después toca el botón de abajo 🌸</p></div><button class="btn" id="btn" type="button">Toca para comenzar 🌸</button></div></section>
</main>
<script>
(()=>{const scene=document.getElementById('scene'),btn=document.getElementById('btn'),start=document.getElementById('start'),petals=document.getElementById('petals'),stars=document.getElementById('stars');let started=false,timer=null;for(let i=0;i<42;i++){const s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*58+'%';s.style.animationDelay=Math.random()*3+'s';stars.appendChild(s)}function petal(){const p=document.createElement('span');p.className='petal';p.style.left=Math.random()*100+'%';p.style.animationDuration=5+Math.random()*5+'s';p.style.transform='scale('+(.5+Math.random())+')';petals.appendChild(p);setTimeout(()=>p.remove(),10500)}function go(){if(started)return;started=true;scene.classList.add('started');start.classList.add('hidden');for(let i=0;i<18;i++)setTimeout(petal,i*100);timer=setInterval(petal,380)}btn.addEventListener('click',go);window.addEventListener('pagehide',()=>{if(timer)clearInterval(timer)})})();
</script>
</body></html>
